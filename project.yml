name: Hisaab
options:
  bundleIdPrefix: com.hisaab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

targets:
  Hisaab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Hisaab
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    info:
      path: Hisaab/Resources/Info.plist
      properties:
        CFBundleDisplayName: Hisaab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSpeechRecognitionUsageDescription: "Used to log expenses by voice."
        NSMicrophoneUsageDescription: "Used to capture your voice for expense logging."
        UIApplicationSupportsIndirectInputEvents: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.hisaab.gmailsync
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.28497511806-kn2vlms1bg8dr2oo80barj3p9kljkvdf
    settings:
      base:
        PRODUCT_NAME: Hisaab
        PRODUCT_BUNDLE_IDENTIFIER: com.hisaab.app
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: YES
